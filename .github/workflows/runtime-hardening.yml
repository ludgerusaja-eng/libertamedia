name: LIBERTAMEDIA Runtime Hardening

on:
  push:
    branches: ['agent/production-hardening']

permissions:
  contents: write

jobs:
  migrate-runtime:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(runtime): apply production migration') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply production runtime migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()

          old = 'const useMySQL = process.env.DATABASE_TYPE === "mysql" || Boolean(process.env.DB_PASSWORD);\nconst storage = useMySQL ? new MySQLStorageAdapter(DATA_DIR) : new JsonStorageAdapter(DATA_DIR);'
          new = '''const useMySQL = process.env.DATABASE_TYPE === "mysql" || Boolean(process.env.DB_PASSWORD);\nif (process.env.NODE_ENV === "production" && !useMySQL) {\n  throw new Error("Production requires DATABASE_TYPE=mysql and MySQL credentials.");\n}\nconst storage = useMySQL ? new MySQLStorageAdapter(DATA_DIR) : new JsonStorageAdapter(DATA_DIR);'''
          s = s.replace(old, new)

          start = s.find('// Security & Authentication Configuration')
          marker = '/* -------------------------------------------------------------\n * API ROUTES: ARTICLES'
          end = s.find(marker)
          if start != -1 and end != -1 and end > start:
            auth = '''// Production authentication: persistent MySQL sessions only.\nimport { ProductionRepository } from "./src/storage/ProductionRepository";\nimport { ProductionAuthService } from "./src/services/production-auth";\nimport { assertPermission, Permission } from "./src/security/rbac";\n\nconst productionRepository = useMySQL ? new ProductionRepository() : null;\nconst productionAuth = productionRepository ? new ProductionAuthService(productionRepository) : null;\n\ntype AuthRequest = express.Request & { user?: any };\n\nfunction getBearerToken(req: express.Request): string | null {\n  const header = req.headers.authorization || req.headers["x-admin-token"];\n  if (!header) return null;\n  const value = String(header);\n  return value.toLowerCase().startsWith("bearer ") ? value.slice(7).trim() : value.trim();\n}\n\nasync function requireAdminAuth(req: AuthRequest, res: express.Response, next: express.NextFunction) {\n  if (!productionAuth) return res.status(503).json({ success: false, message: "Authentication service belum tersedia." });\n  try {\n    const session = await productionAuth.authenticate(getBearerToken(req) || "");\n    if (!session) return res.status(401).json({ success: false, message: "Sesi tidak valid atau telah kedaluwarsa." });\n    req.user = session;\n    return next();\n  } catch (error) {\n    console.error("[AUTH]", error);\n    return res.status(503).json({ success: false, message: "Authentication service unavailable." });\n  }\n}\n\nfunction requirePermission(permission: Permission) {\n  return (req: AuthRequest, res: express.Response, next: express.NextFunction) => {\n    if (!req.user) return res.status(401).json({ success: false, message: "Authentication required." });\n    try { assertPermission(req.user.role, permission); return next(); }\n    catch { return res.status(403).json({ success: false, message: "Anda tidak memiliki izin untuk operasi ini." }); }\n  };\n}\n\napp.post("/api/auth/login", loginRateLimiter, async (req, res) => {\n  if (!productionAuth) return res.status(503).json({ success: false, message: "Authentication service belum tersedia." });\n  const email = String(req.body?.email || "").trim().toLowerCase();\n  const password = String(req.body?.password || "");\n  if (!email || !password) return res.status(400).json({ success: false, message: "Email dan password wajib diisi." });\n  try {\n    const session = await productionAuth.login(email, password);\n    if (!session) return res.status(401).json({ success: false, message: "Email atau password tidak sesuai." });\n    return res.json({ success: true, message: "Login Redaksi Berhasil", token: session.sessionId, expiresAt: session.expiresAt.toISOString(), user: { id: session.userId, role: session.role, name: session.name, email: session.email } });\n  } catch (error) {\n    console.error("[AUTH LOGIN]", error);\n    return res.status(503).json({ success: false, message: "Authentication service unavailable." });\n  }\n});\n\napp.post("/api/auth/logout", async (req, res) => {\n  if (productionAuth) await productionAuth.logout(getBearerToken(req) || "");\n  return res.json({ success: true, message: "Session berhasil diakhiri" });\n});\n\napp.get("/api/auth/me", async (req: AuthRequest, res) => {\n  if (!productionAuth) return res.status(503).json({ success: false, authenticated: false });\n  const session = await productionAuth.authenticate(getBearerToken(req) || "");\n  if (!session) return res.json({ success: true, authenticated: false });\n  return res.json({ success: true, authenticated: true, user: { id: session.userId, role: session.role, name: session.name, email: session.email }, expiresAt: session.expiresAt.toISOString() });\n});\n\n'''
            s = s[:start] + auth + s[end:]
          p.write_text(s)
          PY
      - name: Commit migration
        run: |
          git config user.name 'libertamedia-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(runtime): apply production migration'
          git push
