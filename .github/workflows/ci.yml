name: LIBERTAMEDIA CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: API contract check
        run: npm run check:api

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: test -f dist/index.html && test -f dist/server.cjs

      - name: Verify production files
        run: |
          test -f scripts/preflight.sh
          test -f cpanel_mysql_setup.sql
          test -f scripts/production_smoke_test.ts
          test -f scripts/api_contract_check.ts
          test -f scripts/publish_scheduled.ts

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for committed secrets and unsafe fallback credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'libertamedia2026|admin123|local-admin-token-|JWT_SECRET=.*(secret|password|liberta)' \
            --exclude-dir=.git \
            --exclude-dir=dist \
            --exclude='*.md' \
            --exclude='*.example' \
            --exclude='scripts/preflight.sh' \
            --exclude='scripts/api_contract_check.ts' \
            .; then
            echo 'Unsafe credential/fallback pattern detected.'
            exit 1
          fi
