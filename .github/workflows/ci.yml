name: LIBERTAMEDIA CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: test -f dist/index.html && test -f dist/server.cjs
