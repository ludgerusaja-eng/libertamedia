---
deployment:
  tasks:
    - export DEPLOYPATH=/home/libp7469/libertamedia
    - export PUBLICPATH=/home/libp7469/public_html
    - /bin/cp -Rf * $DEPLOYPATH/
    - /bin/cp -f dist/index.html $PUBLICPATH/index.html
    - /bin/mkdir -p $PUBLICPATH/assets
    - /bin/cp -Rf dist/assets/* $PUBLICPATH/assets/
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
